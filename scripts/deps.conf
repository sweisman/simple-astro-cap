# Vendor SDK sources for scripts/fetch-deps.sh
#
# Shell-sourced KEY=value. Bumping a vendor version should be a one-line edit here,
# never a change to fetch-deps.sh.
#
# *_SHA256 is optional. Leave it empty to skip integrity verification (necessary for
# vendors that serve a freshly-signed URL or rebuild their archive per request). If you
# pin one, get it from a download you have already verified, not from the vendor page.

# ---------------------------------------------------------------------------
# QHYCCD — fully automated. Versioned, stable URL.
# This single archive provides libqhyccd.so, the complete firmware set, the
# official udev rules, and the GPLv2 source for fxload.
# Check https://www.qhyccd.com/download/ for newer versions.
# ---------------------------------------------------------------------------
QHY_VERSION="25.09.29"
QHY_URL="https://www.qhyccd.com/file/repository/publish/SDK/${QHY_VERSION}/sdk_linux64_${QHY_VERSION}.tgz"
QHY_SHA256=""

# ---------------------------------------------------------------------------
# ZWO ASI — automated, but awkward. ZWO's download centre has no Linux-only
# endpoint; the macIntel endpoint serves one ~112 MB ASI_Camera_SDK.zip
# containing every platform, Linux included. The URL redirects to a
# time-signed CDN link, so SHA256 pinning is not practical.
# Landing page: https://www.zwoastro.com/downloads/developers
# ---------------------------------------------------------------------------
ASI_URL="https://dl.zwoastro.com/software?app=DeveloperCameraSdk&platform=macIntel&region=Overseas"
ASI_SHA256=""

# ---------------------------------------------------------------------------
# Player One and Touptek — manual. Neither vendor exposes a stable direct
# download URL, and both backends resolve their library through
# ctypes.util.find_library() rather than the project lib/ directory, so a
# system-wide install from the vendor's own installer is the supported path.
#
# If you would rather keep them project-local, download the Linux SDK archive
# by hand, drop it in vendor-cache/, and fetch-deps.sh will unpack it into lib/.
# ---------------------------------------------------------------------------
PLAYERONE_PAGE="https://player-one-astronomy.com/service/software/"
TOUPTEK_PAGE="https://www.touptek-astro.com/download/"
